<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Get Love Room · Yönetim</title>
<link rel="icon" href="assets/loveroom-logo.webp">
<style>
  :root { --bg: #0d0b1a; --ink: #fff6d8; --dim: #b8ad8c; --sun: #fcdf4b; --card: #17142a; --line: #2e2848; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { color: var(--sun); font-size: 17px; margin: 0 0 10px; }
  section { background: var(--card); border-radius: 14px; padding: 16px; margin-top: 16px; overflow-x: auto; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: #211c38; border-radius: 12px; padding: 12px; } .kpi b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; } .kpi span { color: var(--dim); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; } th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 600; }
  .fb { border-bottom: 1px solid var(--line); padding: 10px 0; } .fb p { margin: 4px 0 0; white-space: pre-wrap; } .tag { font-size: 12px; color: var(--dim); }
  button { font: inherit; background: var(--sun); color: #1a1405; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; }
  .dim { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Get Love Room · Yönetim</h1>
  <p class="dim" id="who">Yalnızca adminler. Admin, Firebase konsolunda <code>admins/&lt;uid&gt;: true</code> eklenerek olur.</p>
  <div id="gate"><button id="login">Google ile gir</button></div>
  <div id="out" hidden></div>
</main>
<script type="module" src="js/panel.js"></script>
</body>
</html>
