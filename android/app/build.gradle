plugins { id 'com.android.application' }

def ks = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
  namespace 'com.eclip.getloveroom'
  compileSdk 34
  defaultConfig {
    applicationId 'com.eclip.getloveroom'
    minSdk 24
    targetSdk 34
    versionCode 5
    versionName '1.4.0'
  }
  signingConfigs {
    release {
      if (ksFile.exists()) {
        storeFile file(ks['storeFile']); storePassword ks['storePassword']
        keyAlias ks['keyAlias']; keyPassword ks['keyPassword']
      }
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.release }
  }
  buildFeatures { buildConfig true }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
  implementation 'androidx.work:work-runtime:2.9.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'
}
